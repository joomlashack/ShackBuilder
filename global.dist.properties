# Copy this file to global.properties to set defaults for all
# projects. Any property described in
# src/clients/build.dist.properties can be set here, except
# builder.path, which must be in each client's build.properties.
# Properties set in a client's build.properties override these.
#
# All settings below are examples. Uncomment and change the
# ones you need.


# Directory containing .composer/vendor/autoload.php, used to
# find globally installed composer packages (e.g. JShrink).
# Only needed if phing does not already load that autoloader,
# e.g. when phing is not installed with `composer global`.
# Note: the .composer subfolder name is fixed. If your global
# composer home is elsewhere (e.g. ~/.config/composer), point
# this to a folder containing a .composer link to it.
# Default: not set (the global autoloader is not loaded)
#home.path=/path/to/user/home/directory

# Parallel threads for related extensions/includes (requires pcntl)
# Default: 2
#builder.thread.count=2

# Keep packages/tmp and write the build properties to package.properties
# Default: 0
#builder.debug=0

# Run php lint on every php file in the package
# Default: 1
#builder.phplint=1

# Move the finished package to project.movePackageTo
# Default: not set (the package stays in ./packages)
#project.movePackage=1
#project.movePackageTo=/path/to/package/destination/folder

# Paths to local clones of shared projects. These are usually
# the same for every extension, so are best set here.
# Default: not set
#project.ShackInstaller.path=/path/to/ShackInstaller
#project.ShackFramework.path=/path/to/ShackFramework
#project.ShackExtensionSupport.path=/path/to/ShackExtensionSupport